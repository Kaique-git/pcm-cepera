<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfólio PCM · Cepêra</title>
<link rel="icon" type="image/png" href="img/logo-cepera.png">
<style>
:root {
    --bg-grad: linear-gradient(135deg, #071a0e 0%, #0d2b16 50%, #123a1c 100%);
    --glass: rgba(255,255,255,0.08);
    --glass-border: rgba(163,230,53,0.22);
    --text: #f1f5f9;
    --text-muted: #9fb8a4;
    --primary: #84cc16;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
body { background: var(--bg-grad) fixed; color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
main { width: 100%; max-width: 860px; }
.hero { display: flex; align-items: center; gap: 18px; margin-bottom: 28px; flex-wrap: wrap; }
.hero img { width: 72px; height: 72px; border-radius: 16px; object-fit: contain; background: rgba(255,255,255,.92); padding: 6px; box-shadow: 0 0 24px rgba(163,230,53,.4); }
.hero h1 { font-size: 30px; background: linear-gradient(90deg, #ffffff, #bef264); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero span { display: block; font-size: 13px; color: var(--text-muted); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin: 0 4px 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; padding: 22px; backdrop-filter: blur(14px); box-shadow: 0 8px 32px rgba(0,0,0,.25); text-decoration: none; color: var(--text); transition: transform .2s, border-color .2s; }
.card:hover { transform: translateY(-4px); border-color: var(--primary); }
.card .ico { font-size: 34px; }
.card .name { font-size: 19px; font-weight: 700; }
.card .desc { font-size: 12.5px; color: var(--text-muted); }
.card .go { margin-top: 10px; font-size: 13px; font-weight: 700; color: #bef264; }
.card.soon { opacity: .55; border-style: dashed; cursor: default; }
.card.soon:hover { transform: none; border-color: var(--glass-border); }
.foot { margin-top: 26px; text-align: center; font-size: 11px; color: var(--text-muted); }
@media (max-width: 640px) {
    .hero { flex-direction: column; text-align: center; }
    .card { padding: 18px; }
}
</style>
</head>
<body>
<main>
    <div class="hero">
        <img src="img/logo-cepera.png" alt="Cepêra">
        <div>
            <h1>Portfólio PCM</h1>
            <span>Command Center · Cepêra Alimentos</span>
        </div>
    </div>
    <div class="label">Projetos</div>
    <div class="grid">
        <a class="card" href="serac1/index.html">
            <span class="ico">📊</span>
            <span class="name">SERAC 1</span>
            <span class="desc">Planos de Ação · Kanban · Prazos Críticos</span>
            <span class="go">Abrir →</span>
        </a>
        <a class="card" href="demandas/index.html">
            <span class="ico">📋</span>
            <span class="name">Demandas PCM</span>
            <span class="desc">Controle de demandas · Responsáveis e Setores</span>
            <span class="go">Abrir →</span>
        </a>
        <div class="card soon">
            <span class="ico">🟢</span>
            <span class="name">Novos projetos</span>
            <span class="desc">Próximos sub-apps entram aqui</span>
        </div>
    </div>
    <div class="foot">PCM · Cepêra Alimentos — gestão integrada de manutenção</div>
</main>
</body>
</html>
